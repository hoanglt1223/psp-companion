[package]
name = "pspc-xcheck"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compiles the PSP client's portable C crypto for the host and checks it against companion-host"
publish = false

[dependencies]
companion-host = { path = "../../host" }

[dev-dependencies]
chacha20poly1305 = "0.11"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"

[build-dependencies]
cc = "1"
