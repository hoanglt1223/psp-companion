[package]
name = "companion-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "PC host for PSP Companion: discovery, pairing, encrypted control and audio channels"
publish = false

[lib]
name = "companion_host"
path = "src/lib.rs"

[[bin]]
name = "companion-host"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = "0.4.45"
color_quant = "2.0.0"
cpal = "0.18"
curve25519-dalek = "5"
directories = "6"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
lz4_flex = "0.14.0"
mp3lame-encoder = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "multipart", "http2"] }
rrule = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "component"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "process", "fs"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.26", optional = true }
unicode-normalization = "0.1.26"
winit = { version = "0.30", optional = true }

[features]
# The tray needs GTK 3 and libappindicator on Linux; `--no-default-features` builds a headless-only host.
default = ["tray"]
tray = ["dep:tray-icon", "dep:winit"]

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
